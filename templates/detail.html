{% extends 'base.html' %}

{% block content %}

<div class="card">

    {% if blog.image %}
        <img src="{{ blog.image.url }}" class="card-img-top" alt="{{ blog.title }}">
    {% endif %}

    <div class="card-body">

        <h1>{{ blog.title }}</h1>

        <h5 class="text-muted">
            By {{ blog.author }}
        </h5>

        <hr>

        <p>
            {{ blog.content }}
        </p>

        <br>

        <a href="{% url 'edit_blog' blog.id %}" class="btn btn-warning">
            ✏️ Edit Blog
        </a>

        <a href="{% url 'delete_blog' blog.id %}" class="btn btn-danger">
            🗑️ Delete Blog
        </a>

        <a href="{% url 'home' %}" class="btn btn-primary">
            ← Back to Home
        </a>

    </div>

</div>

{% endblock %}
