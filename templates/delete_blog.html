{% extends 'base.html' %}

{% block content %}

<div class="card mt-4">
    <div class="card-body">

        <h2>Delete Blog</h2>

        <p>Are you sure you want to delete <strong>{{ blog.title }}</strong>?</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'detail' blog.id %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
